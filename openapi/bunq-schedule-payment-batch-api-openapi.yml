components:
  schemas:
    GinmonTransaction:
      type: object
      properties:
        status:
          type: string
          description: The status of the transaction.
          readOnly: true
          writeOnly: false
        status_description:
          type: string
          description: The status of the transaction.
          readOnly: true
          writeOnly: false
        status_description_translated:
          type: string
          description: The translated status of the transaction.
          readOnly: true
          writeOnly: false
        amount_billing:
          type: object
          description: The final amount the user will pay or receive.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Amount'
        amount_billing_original:
          type: object
          description: The estimated amount the user will pay or receive.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Amount'
        isin:
          type: string
          description: The ISIN of the security.
          readOnly: true
          writeOnly: false
        external_identifier:
          type: string
          description: External identifier of this order at Ginmon.
          readOnly: true
          writeOnly: false
        label_user:
          type: object
          description: The label of the user.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/LabelUser'
        label_monetary_account:
          type: object
          description: The label of the monetary account.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/LabelMonetaryAccount'
        counter_label_monetary_account:
          type: object
          description: The label of the counter monetary account.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/LabelMonetaryAccount'
        event_id:
          type: integer
          description: The id of the event of transaction.
          readOnly: true
          writeOnly: false
    SchedulePaymentBatchUpdate:
      type: object
      properties:
        Id:
          type: object
          description: The id of the created item
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/BunqId'
    SchedulePaymentBatchRead:
      type: object
      properties:
        payments:
          type: array
          description: The payment details.
          readOnly: true
          writeOnly: false
          items:
            $ref: '#/components/schemas/SchedulePaymentEntry'
        schedule:
          type: object
          description: The schedule details.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Schedule'
    PaymentFee:
      type: object
      properties:
        value:
          type: string
          description: The amount formatted to two decimal places.
          readOnly: true
          writeOnly: false
        currency:
          type: string
          description: The currency of the amount. It is an ISO 4217 formatted currency code.
          readOnly: true
          writeOnly: false
        invoice_id:
          type: integer
          description: The id of the invoice related to possible payment fee.
          readOnly: true
          writeOnly: false
    ScheduleAnchorObject:
      type: object
      properties:
        Payment:
          type: object
          description: ''
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Payment'
        PaymentBatch:
          type: object
          description: ''
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/PaymentBatch'
    SchedulePaymentBatch:
      type: object
      properties:
        payments:
          type: array
          description: The payment details.
          readOnly: false
          writeOnly: false
          items:
            $ref: '#/components/schemas/SchedulePaymentEntry'
        schedule:
          type: object
          description: The schedule details.
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/Schedule'
    SchedulePaymentBatchCreate:
      type: object
      properties:
        Id:
          type: object
          description: The id of the created item
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/BunqId'
    Address:
      type: object
      properties:
        street:
          type: string
          description: The street.
          readOnly: false
          writeOnly: false
        house_number:
          type: string
          description: The house number.
          readOnly: false
          writeOnly: false
        po_box:
          type: string
          description: The PO box.
          readOnly: false
          writeOnly: false
        postal_code:
          type: string
          description: The postal code.
          readOnly: false
          writeOnly: false
        city:
          type: string
          description: The city.
          readOnly: false
          writeOnly: false
        country:
          type: string
          description: The country as an ISO 3166-1 alpha-2 country code.
          readOnly: false
          writeOnly: false
        extra:
          type: string
          description: The apartment, building or other extra information for addresses.
          readOnly: false
          writeOnly: false
        mailbox_name:
          type: string
          description: The name on the mailbox (only used for Postal and Shipping addresses).
          readOnly: false
          writeOnly: false
        province:
          type: string
          description: The province according to local standard.
          readOnly: true
          writeOnly: false
        is_user_address_updated:
          type: boolean
          description: To show whether user created or updated her address for app event listing.
          readOnly: true
          writeOnly: false
    PaymentArrivalExpected:
      type: object
      properties:
        status:
          type: string
          description: Indicates when we expect the payment to arrive.
          readOnly: true
          writeOnly: false
        time:
          type: string
          description: The time when the payment is expected to arrive.
          readOnly: true
          writeOnly: false
    SchedulePaymentEntry:
      type: object
      properties:
        amount:
          type: object
          description: The Amount transferred by the Payment. Will be negative for outgoing Payments and positive for incoming Payments (relative to the MonetaryAccount indicated by monetary_account_id).
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/Amount'
        counterparty_alias:
          type: object
          description: The LabelMonetaryAccount containing the public information of the other (counterparty) side of the Payment.
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/LabelMonetaryAccount'
        description:
          type: string
          description: The description for the Payment. Maximum 140 characters for Payments to external IBANs, 9000 characters for Payments to only other bunq MonetaryAccounts.
          readOnly: false
          writeOnly: false
        attachment:
          type: array
          description: The Attachments attached to the Payment.
          readOnly: false
          writeOnly: false
          items:
            $ref: '#/components/schemas/AttachmentMonetaryAccountPayment'
        merchant_reference:
          type: string
          description: Optional data included with the Payment specific to the merchant.
          readOnly: false
          writeOnly: false
        allow_bunqto:
          type: boolean
          description: Whether or not sending a bunq.to payment is allowed.
          readOnly: false
          writeOnly: true
        alias:
          type: object
          description: The LabelMonetaryAccount containing the public information of 'this' (party) side of the Payment.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/LabelMonetaryAccount'
    Amount:
      type: object
      properties:
        value:
          type: string
          description: The amount formatted to two decimal places.
          readOnly: false
          writeOnly: false
        currency:
          type: string
          description: The currency of the amount. It is an ISO 4217 formatted currency code.
          readOnly: false
          writeOnly: false
    PaymentBatch:
      type: object
      properties:
        payments:
          type: object
          description: The list of mutations that were made.
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/PaymentBatchAnchoredPayment'
    LabelUser:
      type: object
      properties:
        uuid:
          type: string
          description: The public UUID of the label-user.
          readOnly: false
          writeOnly: false
        display_name:
          type: string
          description: The name to be displayed for this user, as it was given on the request.
          readOnly: false
          writeOnly: false
        country:
          type: string
          description: The country of the user. 000 stands for "unknown"
          readOnly: false
          writeOnly: false
        avatar:
          type: object
          description: The current avatar of the user.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Avatar'
        public_nick_name:
          type: string
          description: The current nickname of the user.
          readOnly: true
          writeOnly: false
    Error:
      type: array
      items:
        type: object
        properties:
          error_description:
            type: string
            description: The error description in English.
          error_description_translated:
            type: string
            description: The error description translated to the user's language.
    Payment:
      type: object
      properties:
        amount:
          type: object
          description: The Amount transferred by the Payment. Will be negative for outgoing Payments and positive for incoming Payments (relative to the MonetaryAccount indicated by monetary_account_id).
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/Amount'
        counterparty_alias:
          type: object
          description: The LabelMonetaryAccount containing the public information of the other (counterparty) side of the Payment.
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/LabelMonetaryAccount'
        description:
          type: string
          description: The description for the Payment. Maximum 140 characters for Payments to external IBANs, 9000 characters for Payments to only other bunq MonetaryAccounts.
          readOnly: false
          writeOnly: false
        attachment:
          type: array
          description: The Attachments attached to the Payment.
          readOnly: false
          writeOnly: false
          items:
            $ref: '#/components/schemas/AttachmentMonetaryAccountPayment'
        merchant_reference:
          type: string
          description: Optional data included with the Payment specific to the merchant.
          readOnly: false
          writeOnly: false
        allow_bunqto:
          type: boolean
          description: Whether or not sending a bunq.to payment is allowed.
          readOnly: false
          writeOnly: true
        id:
          type: integer
          description: The id of the created Payment.
          readOnly: true
          writeOnly: false
        created:
          type: string
          description: The timestamp when the Payment was done.
          readOnly: true
          writeOnly: false
        updated:
          type: string
          description: The timestamp when the Payment was last updated (will be updated when chat messages are received).
          readOnly: true
          writeOnly: false
        monetary_account_id:
          type: integer
          description: The id of the MonetaryAccount the Payment was made to or from (depending on whether this is an incoming or outgoing Payment).
          readOnly: true
          writeOnly: false
        alias:
          type: object
          description: The LabelMonetaryAccount containing the public information of 'this' (party) side of the Payment.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/LabelMonetaryAccount'
        type:
          type: string
          description: The type of Payment, can be BUNQ, EBA_SCT, EBA_SDD, IDEAL, SWIFT or FIS (card).
          readOnly: true
          writeOnly: false
        sub_type:
          type: string
          description: The sub-type of the Payment, can be PAYMENT, WITHDRAWAL, REVERSAL, REQUEST, BILLING, SCT, SDD or NLO.
          readOnly: true
          writeOnly: false
        payment_arrival_expected:
          type: object
          description: Information about the expected arrival of the payment.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/PaymentArrivalExpected'
        bunqto_status:
          type: string
          description: The status of the bunq.to payment.
          readOnly: true
          writeOnly: false
        bunqto_sub_status:
          type: string
          description: The sub status of the bunq.to payment.
          readOnly: true
          writeOnly: false
        bunqto_share_url:
          type: string
          description: The status of the bunq.to payment.
          readOnly: true
          writeOnly: false
        bunqto_expiry:
          type: string
          description: When bunq.to payment is about to expire.
          readOnly: true
          writeOnly: false
        bunqto_time_responded:
          type: string
          description: The timestamp of when the bunq.to payment was responded to.
          readOnly: true
          writeOnly: false
        batch_id:
          type: integer
          description: The id of the PaymentBatch if this Payment was part of one.
          readOnly: true
          writeOnly: false
        scheduled_id:
          type: integer
          description: The id of the JobScheduled if the Payment was scheduled.
          readOnly: true
          writeOnly: false
        address_shipping:
          type: object
          description: A shipping Address provided with the Payment, currently unused.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Address'
        address_billing:
          type: object
          description: A billing Address provided with the Payment, currently unused.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Address'
        geolocation:
          type: object
          description: The Geolocation where the Payment was done from.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Geolocation'
        request_reference_split_the_bill:
          type: array
          description: The reference to the object used for split the bill. Can be RequestInquiry or RequestInquiryBatch
          readOnly: true
          writeOnly: false
          items:
            $ref: '#/components/schemas/RequestInquiryReference'
        balance_after_mutation:
          type: object
          description: The new balance of the monetary account after the mutation.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Amount'
        payment_auto_allocate_instance:
          type: object
          description: A reference to the PaymentAutoAllocateInstance if it exists.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/PaymentAutoAllocateInstance'
        payment_suspended_outgoing:
          type: object
          description: A reference to the PaymentSuspendedOutgoing if it exists.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/PaymentSuspendedOutgoing'
        payment_fee:
          type: object
          description: Incurred fee for the payment.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/PaymentFee'
    Avatar:
      type: object
      properties:
        uuid:
          type: string
          description: The public UUID of the avatar.
          readOnly: false
          writeOnly: false
        anchor_uuid:
          type: string
          description: The public UUID of object this avatar is anchored to.
          readOnly: true
          writeOnly: false
        image:
          type: array
          description: The actual image information of this avatar.
          readOnly: true
          writeOnly: false
          items:
            $ref: '#/components/schemas/Image'
        style:
          type: string
          description: The style (if applicable) for this Avatar.
          readOnly: true
          writeOnly: false
    Pointer:
      type: object
      properties:
        type:
          type: string
          description: 'The alias type, can be: EMAIL|PHONE_NUMBER|IBAN.'
          readOnly: false
          writeOnly: false
        value:
          type: string
          description: The alias value.
          readOnly: false
          writeOnly: false
        name:
          type: string
          description: The alias name.
          readOnly: false
          writeOnly: false
        service:
          type: string
          description: The pointer service. Only required for external counterparties.
          readOnly: false
