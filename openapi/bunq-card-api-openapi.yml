openapi: 3.2.0
info:
  title: bunq Card API
  description: '***UPDATE:*** *We have released a beta version of the new bunq API documentation.*


    ***NOTICE:*** *We have updated the sandbox base url to `https://public-api.sandbox.bunq.com/v1/`. Please update your applications accordingly. Check here: for more info.*


    ***PSD2 NOTICE:*** *The second Payment Services Directive (PSD2) may affect your current or planned usage of our public API, as some of the API services are now subject to a permit. Please be aware that using our public API without the required PSD2 permit is at your own risk and take notice of our updated API Terms and Conditions on for more information.*


    # Introduction


    Welcome to bunq! - The bunq API is organised around REST. JSON will be returned in almost all responses from the API, including errors but excluding binary (image) files. - Please configure your implementation to send its API requests to `https://public-api.sandbox.bunq.com/v1/`

    - There is a version of the Android app that connects to the bunq Sandbox environment. To create accounts for the Sandbox app, please follow the steps in the Android Emulator section. ## Getting started


    Before you start sending API requests, you need to get an API key and activate it. API activation happens when you install the API key and link your IP address and device to it *(create an API context)*. The steps below will guide you through what you need to do to start sending custom API requests. Here is an overview of what you can use to get started with the bunq API:

    1. **Create an API key.** You can do it either in our developer portal or in the bunq app *(Profile → Security & Settings → Developers → API keys)*. If you want to test our sandbox first, our bunq Developer is the best place to start. 2. **Register a device.** A device can be a phone (private), computer or a server (public). You can register a new device by using the `POST /installation` and `POST /device-server` calls. This will activate your API key. You only need to do this once. 3. **Open a session.** Sessions are temporary and expire after the auto-logout time set for the user account. It can be changed by the account owner in the bunq app. 4. **Make your first call!**


    !bunq_API_context


    ## Versioning


    Developments in the financial sector, changing regulatory regimes and new feature requests require us to be flexible. This means we can iterate quickly to improve the API and related tooling. Therefore, we have chosen not to attach any version numbers to the changes just yet. We will inform you in a timely manner of any important changes we make before they are deployed on together.bunq.com. You can also subscribe to our API newsletter to make sure you don''t miss any important updates. # OAuth


    ## What is OAuth? OAuth 2.0 is a protocol that will let your app connect to bunq users in a safe and easy way. Please be aware that if you will gain access to the account information of other bunq users or initiate a payment for them, you may require a PSD2 permit. ## Get started with OAuth for bunq


    To initiate authorization into the bunq user accounts, you need to create an OAuth Client and register at least 1 redirect URL for it. You can have 1 OAuth Client at a time. Reuse your OAuth credentials for every authorization request. The list of steps below will help you to get started:


    1. Register an OAuth Client by creating an app in bunq Developer_._

    2. Add one or more Redirect URLs. 3. Get your `client_id` and `secret` from your app information tab in bunq Developer. 4. Redirect your users to the OAuth authorization request URL. 5. If the user accepts the authorization request, they will be redirected to the previously specified `redirect_uri` with an authorization `code` parameter. 6. Use the token endpoint to exchange the authorization `code` for an `access_token`. 7. Use the `access_token` as a normal API Key. Open a session or use our SDKs to get started. You can set up an OAuth Client and add redirect URLs to it using the dedicated endpoints too.'
  termsOfService: http://bunq.com/terms-api/
  contact:
    name: bunq Developer Support
    url: http://bunq.com/developer
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: '1.0'
servers:
- url: https://public-api.sandbox.bunq.com/{basePath}
  description: Sandbox server
  variables:
    basePath:
      default: v1
- url: https://api.bunq.com/{basePath}
  description: Production server
  variables:
    basePath:
      default: v1
tags:
- name: Card
  description: ''
paths:
  /user/{userID}/card/{itemId}:
    put:
      tags:
      - Card
      summary: UPDATE card for user
      operationId: UPDATE_Card_for_User
      description: Update the card details. Allow to change pin code, status, limits, country permissions and the monetary account connected to the card. When the card has been received, it can be also activated through this endpoint.
      parameters:
      - in: path
        name: userID
        description: ''
        required: true
        schema:
          type: integer
      - in: path
        name: itemId
        description: ''
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/Cache-Control'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/X-Bunq-Language'
      - $ref: '#/components/parameters/X-Bunq-Region'
      - $ref: '#/components/parameters/X-Bunq-Client-Request-Id'
      - $ref: '#/components/parameters/X-Bunq-Geolocation'
      - $ref: '#/components/parameters/X-Bunq-Client-Authentication'
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Card'
      responses:
        '200':
          description: Endpoint for retrieving details for the cards the user has access to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardUpdate'
          headers:
            X-Bunq-Client-Response-Id:
              $ref: '#/components/headers/X-Bunq-Client-Response-Id'
            X-Bunq-Client-Request-Id:
              $ref: '#/components/headers/X-Bunq-Client-Request-Id'
            X-Bunq-Server-Signature:
              $ref: '#/components/headers/X-Bunq-Server-Signature'
        '400':
          $ref: '#/components/responses/GenericError'
      x-summary-source: derived
    get:
      tags:
      - Card
      summary: READ card for user
      operationId: READ_Card_for_User
      description: Return the details of a specific card.
      parameters:
      - in: path
        name: userID
        description: ''
        required: true
        schema:
          type: integer
      - in: path
        name: itemId
        description: ''
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/Cache-Control'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/X-Bunq-Language'
      - $ref: '#/components/parameters/X-Bunq-Region'
      - $ref: '#/components/parameters/X-Bunq-Client-Request-Id'
      - $ref: '#/components/parameters/X-Bunq-Geolocation'
      - $ref: '#/components/parameters/X-Bunq-Client-Authentication'
      responses:
        '200':
          description: Endpoint for retrieving details for the cards the user has access to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardRead'
          headers:
            X-Bunq-Client-Response-Id:
              $ref: '#/components/headers/X-Bunq-Client-Response-Id'
            X-Bunq-Client-Request-Id:
              $ref: '#/components/headers/X-Bunq-Client-Request-Id'
            X-Bunq-Server-Signature:
              $ref: '#/components/headers/X-Bunq-Server-Signature'
        '400':
          $ref: '#/components/responses/GenericError'
      x-summary-source: derived
  /user/{userID}/card:
    get:
      tags:
      - Card
      summary: List all card for user
      operationId: List_all_Card_for_User
      description: Return all the cards available to the user.
      parameters:
      - in: path
        name: userID
        description: ''
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/Cache-Control'
      - $ref: '#/components/parameters/User-Agent'
      - $ref: '#/components/parameters/X-Bunq-Language'
      - $ref: '#/components/parameters/X-Bunq-Region'
      - $ref: '#/components/parameters/X-Bunq-Client-Request-Id'
      - $ref: '#/components/parameters/X-Bunq-Geolocation'
      - $ref: '#/components/parameters/X-Bunq-Client-Authentication'
      responses:
        '200':
          description: Endpoint for retrieving details for the cards the user has access to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardListing'
          headers:
            X-Bunq-Client-Response-Id:
              $ref: '#/components/headers/X-Bunq-Client-Response-Id'
            X-Bunq-Client-Request-Id:
              $ref: '#/components/headers/X-Bunq-Client-Request-Id'
            X-Bunq-Server-Signature:
              $ref: '#/components/headers/X-Bunq-Server-Signature'
        '400':
          $ref: '#/components/responses/GenericError'
      x-summary-source: derived
components:
  schemas:
    MonetaryAccountProfile:
      type: object
      properties:
        profile_fill:
          type: object
          description: The profile settings for triggering the fill of a monetary account.
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/MonetaryAccountProfileFill'
        profile_drain:
          type: object
          description: The profile settings for moving excesses to a savings account
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/MonetaryAccountProfileDrain'
    MonetaryAccountSwitchService:
      type: object
      properties:
        id:
          type: integer
          description: The id of the monetary account.
          readOnly: true
          writeOnly: false
        created:
          type: string
          description: The timestamp of the monetary account's creation.
          readOnly: true
          writeOnly: false
        description:
          type: string
          description: The description for the bank account.
          readOnly: true
          writeOnly: false
        status:
          type: string
          description: The status of the account.
          readOnly: true
          writeOnly: false
        sub_status:
          type: string
          description: The sub-status of the account.
          readOnly: true
          writeOnly: false
    Card:
      type: object
      properties:
        pin_code:
          type: string
          description: The plaintext pin code. Requests require encryption to be enabled.
          readOnly: false
          writeOnly: true
        activation_code:
          type: string
          description: 'DEPRECATED: Activate a card by setting status to ACTIVE when the order_status is ACCEPTED_FOR_PRODUCTION.'
          readOnly: false
          writeOnly: true
        status:
          type: string
          description: The status to set for the card. Can be ACTIVE, DEACTIVATED, LOST, STOLEN or CANCELLED, and can only be set to LOST/STOLEN/CANCELLED when order status is ACCEPTED_FOR_PRODUCTION/DELIVERED_TO_CUSTOMER/CARD_UPDATE_REQUESTED/CARD_UPDATE_SENT/CARD_UPDATE_ACCEPTED. Can only be set to DEACTIVATED after initial activation, i.e. order_status is DELIVERED_TO_CUSTOMER/CARD_UPDATE_REQUESTED/CARD_UPDATE_SENT/CARD_UPDATE_ACCEPTED. Mind that all the possible choices (apart from ACTIVE and DEACTIVATED) are permanent and cannot be changed after.
          readOnly: false
          writeOnly: false
        order_status:
          type: string
          description: The order status to set for the card. Set to CARD_REQUEST_PENDING to get a virtual card produced.
          readOnly: false
          writeOnly: false
        card_limit:
          type: object
          description: The spending limit for the card.
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/Amount'
        card_limit_atm:
          type: object
          description: The ATM spending limit for the card.
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/Amount'
        country_permission:
          type: array
          description: The countries for which to grant (temporary) permissions to use the card.
          readOnly: false
          writeOnly: false
          items:
            $ref: '#/components/schemas/CardCountryPermission'
        pin_code_assignment:
          type: array
          description: Array of Types, PINs, account IDs assigned to the card.
          readOnly: false
          writeOnly: false
          items:
            $ref: '#/components/schemas/CardPinAssignment'
        primary_account_numbers:
          type: array
          description: Array of PANs and their attributes.
          readOnly: false
          writeOnly: false
          items:
            $ref: '#/components/schemas/CardPrimaryAccountNumber'
        monetary_account_id_fallback:
          type: integer
          description: ID of the MA to be used as fallback for this card if insufficient balance. Fallback account is removed if not supplied.
          readOnly: false
          writeOnly: false
        preferred_name_on_card:
          type: string
          description: The user's preferred name as it will be on the card.
          readOnly: false
          writeOnly: false
        second_line:
          type: string
          description: The second line of text on the card
          readOnly: false
          writeOnly: false
        cancellation_reason:
          type: string
          description: The reason for card cancellation.
          readOnly: false
          writeOnly: true
    OpenBankingProviderBank:
      type: object
      properties:
        account_information_service_status:
          type: string
          description: Whether we support Open Banking budgeting using the bank provider.
          readOnly: false
          writeOnly: false
        payment_information_service_status:
          type: string
          description: Whether we support top ups using the bank provider.
          readOnly: false
          writeOnly: false
        name:
          type: string
          description: The name of the bank provider.
          readOnly: true
          writeOnly: false
        aiia_provider_id:
          type: string
          description: The external identifier for this bank.
          readOnly: true
          writeOnly: false
        country:
          type: string
          description: Country of provider
          readOnly: true
          writeOnly: false
        all_payment_method_allowed_sepa:
          type: array
          description: All payment methods allowed for Sepa payments.
          readOnly: true
          writeOnly: false
          items:
            type: string
        all_payment_method_allowed_domestic:
          type: array
          description: All payment methods allowed for Domestic payments.
          readOnly: true
          writeOnly: false
          items:
            type: string
        audience_business_status:
          type: boolean
          description: Whether business banking is supported by the provider.
          readOnly: true
          writeOnly: false
        audience_private_status:
          type: boolean
          description: Whether personal banking is supported by the provider.
          readOnly: true
          writeOnly: false
        avatar:
          type: object
          description: The avatar of the bank.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Avatar'
    ShareDetail:
      type: object
      properties:
        payment:
          type: object
          description: The share details for a payment share. In the response 'payment' is replaced by 'ShareDetailPayment'.
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/ShareDetailPayment'
        read_only:
          type: object
          description: The share details for viewing a share. In the response 'read_only' is replaced by 'ShareDetailReadOnly'.
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/ShareDetailReadOnly'
        draft_payment:
          type: object
          description: The share details for a draft payment share. In the response 'draft_payment' is replaced by 'ShareDetailDraftPayment'.
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/ShareDetailDraftPayment'
    CardReplacement:
      type: object
      properties:
        status:
          type: string
          description: The status of the CardReplacement.
          readOnly: false
          writeOnly: false
        address_main:
          type: object
          description: The user's main address.
          readOnly: false
          writeOnly: true
          $ref: '#/components/schemas/Address'
        address_postal:
          type: object
          description: The user's postal address.
          readOnly: false
          writeOnly: true
          $ref: '#/components/schemas/Address'
        card_id:
          type: integer
          description: The original card that belongs to the CardReplacement.
          readOnly: true
          writeOnly: false
        card_new_id:
          type: integer
          description: The new card that replaces the original card in the CardReplacement.
          readOnly: true
          writeOnly: false
    MonetaryAccountInvestment:
      type: object
      properties:
        currency:
          type: string
          description: The currency of the MonetaryAccountInvestment as an ISO 4217 formatted currency code.
          readOnly: false
          writeOnly: false
        provider:
          type: string
          description: The provider of the investment service.
          readOnly: false
          writeOnly: true
        description:
          type: string
          description: The description of the MonetaryAccountInvestment. Defaults to 'bunq account'.
          readOnly: false
          writeOnly: false
        daily_limit:
          type: object
          description: The daily spending limit Amount of the MonetaryAccountInvestment. Defaults to 1000 EUR. Currency must match the MonetaryAccountInvestment's currency. Limited to 10000 EUR.
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/Amount'
        avatar_uuid:
          type: string
          description: The UUID of the Avatar of the MonetaryAccountInvestment.
          readOnly: false
          writeOnly: true
        status:
          type: string
          description: 'The status of the MonetaryAccountInvestment. Can be: ACTIVE, BLOCKED, CANCELLED or PENDING_REOPEN'
          readOnly: false
          writeOnly: false
        sub_status:
          type: string
          description: The sub-status of the MonetaryAccountInvestment providing extra information regarding the status. Will be NONE for ACTIVE or PENDING_REOPEN, COMPLETELY or ONLY_ACCEPTING_INCOMING for BLOCKED and REDEMPTION_INVOLUNTARY, REDEMPTION_VOLUNTARY or PERMANENT for CANCELLED.
          readOnly: false
          writeOnly: false
        reason:
          type: string
          description: The reason for voluntarily cancelling (closing) the MonetaryAccountInvestment, can only be OTHER.
          readOnly: false
          writeOnly: false
        reason_description:
          type: string
          description: The optional free-form reason for voluntarily cancelling (closing) the MonetaryAccountInvestment. Can be any user provided message.
          readOnly: false
          writeOnly: false
        display_name:
          type: string
          description: The legal name of the user / company using this monetary account.
          readOnly: false
          writeOnly: false
        setting:
          type: object
          description: The settings of the MonetaryAccountInvestment.
          readOnly: false
          writeOnly: false
          $ref: '#/components/schemas/MonetaryAccountSetting'
        birdee_investment_portfolio:
          type: object
          description: The Birdee investment portfolio.
          readOnly: false
          writeOnly: true
          $ref: '#/components/schemas/BirdeeInvestmentPortfolio'
        monetary_account_deposit_initial_id:
          type: integer
          description: ID of the MA to be used for the initial deposit to the investment account.
          readOnly: false
          writeOnly: true
        amount_deposit_initial:
          type: object
          description: The amount to be transferred to the investment account as the initial deposit.
          readOnly: false
          writeOnly: true
          $ref: '#/components/schemas/Amount'
        id:
          type: integer
          description: The id of the MonetaryAccountInvestment.
          readOnly: true
          writeOnly: false
        created:
          type: string
          description: The timestamp of the MonetaryAccountInvestment's creation.
          readOnly: true
          writeOnly: false
        updated:
          type: string
          description: The timestamp of the MonetaryAccountInvestment's last update.
          readOnly: true
          writeOnly: false
        avatar:
          type: object
          description: The Avatar of the MonetaryAccountInvestment.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Avatar'
        balance:
          type: object
          description: The current available balance Amount of the MonetaryAccountInvestment.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Amount'
        alias:
          type: array
          description: The Aliases for the MonetaryAccountInvestment.
          readOnly: true
          writeOnly: false
          items:
            $ref: '#/components/schemas/Pointer'
        public_uuid:
          type: string
          description: The MonetaryAccountInvestment's public UUID.
          readOnly: true
          writeOnly: false
        user_id:
          type: integer
          description: The id of the User who owns the MonetaryAccountInvestment.
          readOnly: true
          writeOnly: false
        monetary_account_profile:
          type: object
          description: The profile of the account.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/MonetaryAccountProfile'
        all_auto_save_id:
          type: array
          description: The ids of the AutoSave.
          readOnly: true
          writeOnly: false
          items:
            $ref: '#/components/schemas/BunqId'
      required:
      - provider
    CardRead:
      type: object
      properties:
        id:
          type: integer
          description: The id of the card.
          readOnly: true
          writeOnly: false
        created:
          type: string
          description: The timestamp of the card's creation.
          readOnly: true
          writeOnly: false
        updated:
          type: string
          description: The timestamp of the card's last update.
          readOnly: true
          writeOnly: false
        public_uuid:
          type: string
          description: The public UUID of the card.
          readOnly: true
          writeOnly: false
        user_id:
          type: integer
          description: DEPRECATED. ID of the user who is owner of the card.
          readOnly: true
          writeOnly: false
        user_owner_id:
          type: integer
          description: ID of the user who is owner of the card.
          readOnly: true
          writeOnly: false
        user_holder_id:
          type: integer
          description: ID of the user who is holder of the card.
          readOnly: true
          writeOnly: false
        type:
          type: string
          description: The type of the card. Can be MAESTRO, MASTERCARD.
          readOnly: true
          writeOnly: false
        sub_type:
          type: string
          description: The sub-type of the card.
          readOnly: true
          writeOnly: false
        product_type:
          type: string
          description: The product type of the card.
          readOnly: true
          writeOnly: false
        product_sub_type:
          type: string
          description: The product sub-type of the card.
          readOnly: true
          writeOnly: false
        first_line:
          type: string
          description: The first line of text on the card
          readOnly: true
          writeOnly: false
        second_line:
          type: string
          description: The second line of text on the card
          readOnly: true
          writeOnly: false
        status:
          type: string
          description: The status to set for the card. Can be ACTIVE, DEACTIVATED, LOST, STOLEN, CANCELLED, EXPIRED or PIN_TRIES_EXCEEDED.
          readOnly: true
          writeOnly: false
        sub_status:
          type: string
          description: The sub-status of the card. Can be NONE or REPLACED.
          readOnly: true
          writeOnly: false
        order_status:
          type: string
          description: The order status of the card. Can be NEW_CARD_REQUEST_RECEIVED, CARD_REQUEST_PENDING, SENT_FOR_PRODUCTION, ACCEPTED_FOR_PRODUCTION, DELIVERED_TO_CUSTOMER, CARD_UPDATE_REQUESTED, CARD_UPDATE_PENDING, CARD_UPDATE_SENT, CARD_UPDATE_ACCEPTED, VIRTUAL_DELIVERY, NEW_CARD_REQUEST_PENDING_USER_APPROVAL, SENT_FOR_DELIVERY or NEW_CARD_REQUEST_CANCELLED.
          readOnly: true
          writeOnly: false
        expiry_date:
          type: string
          description: Expiry date of the card.
          readOnly: true
          writeOnly: false
        name_on_card:
          type: string
          description: The user's name on the card.
          readOnly: true
          writeOnly: false
        preferred_name_on_card:
          type: string
          description: The user's preferred name on the card.
          readOnly: true
          writeOnly: false
        primary_account_numbers:
          type: array
          description: Array of PANs and their attributes.
          readOnly: true
          writeOnly: false
          items:
            $ref: '#/components/schemas/CardPrimaryAccountNumber'
        payment_account_reference:
          type: string
          description: The payment account reference number associated with the card.
          readOnly: true
          writeOnly: false
        card_limit:
          type: object
          description: The spending limit for the card.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Amount'
        card_limit_atm:
          type: object
          description: The ATM spending limit for the card.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/Amount'
        country_permission:
          type: array
          description: The countries for which to grant (temporary) permissions to use the card.
          readOnly: true
          writeOnly: false
          items:
            $ref: '#/components/schemas/CardCountryPermission'
        label_monetary_account_ordered:
          type: object
          description: The monetary account this card was ordered on and the label user that owns the card.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/LabelMonetaryAccount'
        label_monetary_account_current:
          type: object
          description: The monetary account that this card is currently linked to and the label user viewing it.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/LabelMonetaryAccount'
        monetary_account:
          type: object
          description: Current monetary account (only for prepaid credit cards).
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/MonetaryAccount'
        pin_code_assignment:
          type: array
          description: Array of Types, PINs, account IDs assigned to the card.
          readOnly: true
          writeOnly: false
          items:
            $ref: '#/components/schemas/CardPinAssignment'
        monetary_account_id_fallback:
          type: integer
          description: ID of the MA to be used as fallback for this card if insufficient balance. Fallback account is removed if not supplied.
          readOnly: true
          writeOnly: false
        country:
          type: string
          description: The country that is domestic to the card. Defaults to country of residence of user.
          readOnly: true
          writeOnly: false
        card_shipment_tracking_url:
          type: string
          description: A tracking link provided by our shipment provider.
          readOnly: true
          writeOnly: false
        is_card_eligible_for_free_replacement:
          type: boolean
          description: Whether this card is eligible for a free replacement.
          readOnly: true
          writeOnly: false
        card_replacement:
          type: object
          description: The card replacement for this card.
          readOnly: true
          writeOnly: false
          $ref: '#/components/schemas/CardReplacement'
